<div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Contacte-nous !</h1>
      <p class="py-6">
        Une question, un projet ou envie de dire bonjour ? Remplis ce formulaire et nous te répondrons rapidement.
      </p>
    </div>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <form class="card-body">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Nom</span>
          </label>
          <input type="text" placeholder="Ton nom" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">Email</span>
          </label>
          <input type="email" placeholder="ton@email.com" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">Message</span>
          </label>
          <textarea placeholder="Ton message..." class="textarea textarea-bordered h-24" required></textarea>
        </div>
        <div class="form-control mt-6">
          <button class="btn btn-primary">Envoyer</button>
        </div>
      </form>
    </div>
  </div>
</div>
