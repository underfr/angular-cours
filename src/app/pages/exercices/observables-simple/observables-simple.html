<div class="max-w-md mx-auto my-8 p-6 bg-base-100 rounded-2xl shadow-xl border border-base-200">

  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-base-content">Générateur de Nombres</h2>

    @if (subscription && !paused()) {
      <span class="loading loading-spinner text-primary loading-md"></span>
    }
  </div>

  <div class="join w-full mb-6">
    <button
      class="btn btn-primary join-item flex-1 text-white gap-2"
      [disabled]="subscription && !paused()"
      (click)="start()">
      Démarrer
    </button>

    <button
      class="btn btn-warning join-item flex-1"
      [disabled]="numbers().length === 0"
      (click)="pauseResume()">
      {{ paused() ? 'Reprendre' : 'Pause' }}
    </button>

    <button
      class="btn btn-error join-item flex-1 text-white"
      [disabled]="numbers().length === 0 && !subscription"
      (click)="stop()">
      Arrêter
    </button>
  </div>

  <div class="bg-base-200 p-4 rounded-xl min-h-30 flex flex-col justify-center items-center">
    @if (numbers().length === 0) {
      <div class="alert alert-info shadow-sm max-w-xs justify-center py-2">
        <span class="text-sm font-medium">En attente de démarrage...</span>
      </div>
    } @else {
      <div class="w-full">
        <p class="text-xs text-base-content/60 mb-2 font-semibold">
          Total : {{ numbers().length }} nombre(s) émis
        </p>
        <div class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1">
          @for (item of numbers(); track $index) {
            <span class="badge badge-lg badge-secondary font-mono animate-fade-in shadow-sm">
              {{ item }}
            </span>
          }
        </div>
      </div>
    }
  </div>
</div>
