<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">

      <h2 class="card-title justify-center text-2xl mb-2">Create an account</h2>
      @if (securityWarning()) {
        <div role="alert" class="alert alert-warning mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span>{{ securityWarning() }}</span>
        </div>
      }

      <form class="flex flex-col gap-3" (ngSubmit)="handleSubmit()">

        <div class="form-control">
          <label class="label" for="email">
            <span class="label-text">Email address</span>
          </label>
          <input
            id="email"
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="address@mail.com"
            class="input input-bordered w-full"
            [class]="{ 'input-error': emailError() }"
          >
          @if (emailError() !== '') {
            <p class="text-error text-sm mt-1">{{ emailError() }}</p>
          }
        </div>

        <div class="form-control">
          <label class="label" for="phone">
            <span class="label-text">Phone</span>
          </label>
          <input
            id="phone"
            [(ngModel)]="phone"
            name="phone"
            type="text"
            placeholder="+33000000"
            class="input input-bordered w-full"
          >
        </div>

        <div class="form-control">
          <label class="label" for="password">
            <span class="label-text">Password</span>
          </label>
          <input
            id="password"
            [(ngModel)]="password"
            name="password"
            [type]="showPassword() ? 'text': 'password'"
            placeholder="*******"
            class="input input-bordered w-full"
          >

          <div class="flex items-center gap-4 mt-3">
            <button type="button" class="btn btn-primary btn-sm" (click)="showPassword.update(s => !s)">
              {{ showPassword() ? 'Hide password' : 'Show password'}}
            </button>

            <progress
              class="progress flex-1"
              [class]="progressClass()"
              [value]="score()"
              max="5"
            ></progress>
          </div>

          <ul class="mt-3 space-y-1">
            @for (check of passwordChecks(); track $index) {
              <li class="flex items-center gap-2 text-sm" [class]="check.valid ? 'text-success' : 'text-base-content/50'">
                <span class="font-bold">{{check.valid ? '✓' : '○'}}</span>
                {{check.label}}
              </li>
            }
          </ul>
        </div>
        <button type="submit" class="btn btn-primary mt-2" [disabled]="!isFormValid()">
          Sign up
        </button>

      </form>
    </div>
  </div>
</div>
