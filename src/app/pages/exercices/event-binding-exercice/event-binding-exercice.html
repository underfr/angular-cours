<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body gap-4">
      <h2 class="card-title text-2xl justify-center">List Friends</h2>

      <fieldset class="fieldset">
        <label for="friendInput" class="fieldset-legend">Nom de l'ami</label>
        <input
          class="input input-bordered w-full"
          type="text"
          id="friendInput"
          name="friendInput"
          placeholder="Entrer le nom d'un ami"
          (keyup)="onInputChange($event)">
          <p class="label">{{ keyPressed }}</p>
      </fieldset>

      <div role="alert" class="alert alert-soft"
           [class.alert-info]="listFriendsCreationStatus === 'Aucun ami'"
           [class.alert-success]="listFriendsCreationStatus !== 'Aucun ami'">
        <span>{{ listFriendsCreationStatus }}</span>
      </div>

      <div class="card-actions">
        <button
          class="btn btn-primary w-full"
          [disabled]="isButtonDisabled()"
          (click)="listFriendsCreationStatus = 'Votre ami a été ajouté'">
          Ajouter un ami
        </button>
      </div>
    </div>
  </div>
</div>
