@if (newData()) {
  <div class="card w-full max-w-2xl bg-base-200 shadow-xl mx-auto">
    <div class="card-body items-center text-center">
      <div class="avatar mb-4">
        <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
          <img [ngSrc]="newData().results[0].picture.large" alt="Photo de profil" width="200" height="200"/>
        </div>
      </div>
      <h2 class="card-title text-2xl font-bold">
        {{ newData().results[0].name.first }} {{ newData().results[0].name.last }}
      </h2>
      <div class="divider my-1"></div>
      <div class="w-full text-left space-y-3 mt-2">
        <div class="flex items-center justify-between">
          <span class="badge badge-ghost">Email</span>
          <span class="text-sm font-medium">{{ newData().results[0].email }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="badge badge-ghost">Téléphone</span>
          <span class="text-sm font-medium">{{ newData().results[0].phone }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="badge badge-ghost">Localisation</span>
          <span class="text-sm font-medium ml-2">
          {{ newData().results[0].location.city }}, {{ newData().results[0].location.country }}
        </span>
        </div>
      </div>
    </div>
  </div>
}
