<div class="min-h-screen flex flex-col items-center justify-center gap-4">
  <h2 class="text-2xl font-bold text-primary">Attribute Binding</h2>

<div class="card bg-base-200 w-96 shadow-xl">
  <figure class="pt-8">
    <div class="avatar"
         [class.avatar-online]="user.status === 'online'"
         [class.avatar-offline]="user.status === 'offline'">
      <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
        <img [src]="user.image" [alt]="'Photo de ' + user.name">
      </div>
    </div>
  </figure>

  <div class="card-body items-center text-center">
    <h3 class="card-title">
      {{ user.name }}
      <div class="badge badge-neutral">{{ user.age }} ans</div>
    </h3>

    <p class="text-base-content/70">{{ user.bio }}</p>

    <div class="badge"
         [class.badge-success]="user.status === 'online'"
         [class.badge-error]="user.status === 'offline'">
      Réputation : {{ user.status === 'online' ? 'cool' : 'Ringard' }}
    </div>

    <div class="card-actions mt-4">
      <a class="btn btn-primary btn-sm"
         [href]="user.github"
         target="_blank"
         rel="noopener">
        GitHub
      </a>
    </div>
  </div>
</div>
</div>
